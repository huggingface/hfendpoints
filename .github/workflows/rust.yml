name: Rust

on:
  push:
    branches: [ "main", "hfendpoints-v*.*" ]
  pull_request:
    branches: [ "main", "hfendpoints-v*.*" ]
  merge_group:


env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  # Basic actions that must pass before we kick off more expensive tests.
  basics:
    permissions: {}
    name: QA Checks
    runs-on: ubuntu-latest
    needs:
      - clippy
      - fmt
    steps:
      - run: exit 0

  fmt:
    permissions:
      contents: read
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2

      # Check fmt
      - name: "rustfmt --check"
        run: rustfmt --check --edition 2024

  clippy:
    permissions:
      contents: read
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
      # Run clippy
      - name: "clippy --all"
        run: cargo clippy --all --tests --all-features --no-deps

  #  docs:
  #    name: docs
  #    runs-on: ${{ matrix.run.os }}
  #    strategy:
  #      matrix:
  #        run:
  #          - os: windows-latest
  #          - os: ubuntu-latest
  #
  #    steps:
  #      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
  #      - name: Install Rust ${{ env.rust_nightly }}
  #        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
  #        with:
  #          toolchain: ${{ env.rust_nightly }}
  #      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
  #      - name: "doc --lib --all-features"
  #        run: |
  #          cargo doc --lib --no-deps --all-features --document-private-items
  #        env:
  #          RUSTFLAGS: --cfg docsrs
  #          RUSTDOCFLAGS: --cfg docsrs  -Dwarnings

  hfendpoints-workspace:
    permissions:
      contents: read
    needs: basics
    name: Build & tests hfendpoints
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        python: [ 3.12, 3.13 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose